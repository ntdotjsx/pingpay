kind: pipeline
type: docker
name: pingpay-pipeline

trigger:
  branch:
    - hello-world
  event:
    - push

steps:
  - name: build-backend
    image: plugins/docker
    privileged: true
    settings:
      repo: 192.168.1.101:5000/pingpay-backend
      registry: 192.168.1.101:5000
      insecure: true
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
      dockerfile: server/Dockerfile
      context: server

  - name: build-frontend
    image: plugins/docker
    privileged: true
    settings:
      repo: 192.168.1.101:5000/pingpay-frontend
      registry: 192.168.1.101:5000
      insecure: true
      build_args:
        - NODE_ENV=production
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
      dockerfile: client/Dockerfile
      context: client
      custom_labels:
        - 'build=debug'

  - name: deploy
    image: appleboy/drone-ssh
    depends_on:
      - build-backend
      - build-frontend
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      port: 22
      script:
        - cd /var/www/pingpay
        - cp /home/ntdotjsx/.env.pingpay /var/www/pingpay/.env
        - cp /home/ntdotjsx/.env.pingpay /var/www/pingpay/server/.env
        - docker compose pull
        - docker compose up -d --force-recreate
        - docker compose exec backend php artisan optimize:clear
        - docker compose exec backend php artisan migrate --force
