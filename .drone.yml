kind: pipeline
type: docker
name: pingpay-pipeline

steps:
  # 1. Build และ Push backend image ไป registry
  - name: build-backend
    image: plugins/docker
    privileged: true
    settings:
      repo: 192.168.1.101:5000/pingpay-backend
      registry: 192.168.1.101:5000
      insecure: true
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
      dockerfile: server/Dockerfile
      context: server

  # 2. Build และ Push frontend image ไป registry
  - name: build-frontend
    image: plugins/docker
    privileged: true
    settings:
      repo: 192.168.1.101:5000/pingpay-frontend
      registry: 192.168.1.101:5000
      insecure: true
      build_args:
        - NODE_ENV=production
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
      dockerfile: client/Dockerfile
      context: client
      custom_labels:
        - "build=debug"

  # 3. SSH ไป VM #2 แล้ว pull + deploy
  - name: deploy
    image: appleboy/drone-ssh
    depends_on:
      - build-backend
      - build-frontend
    when:
      branch:
        - main
      event:
        - push
    settings:
      host:
        from_secret: deploy_host
      username:
        from_secret: deploy_user
      key:
        from_secret: deploy_ssh_key
      port: 22
      script:
        - cd /var/www/pingpay
        - cp /home/deploy/.env.pingpay /var/www/pingpay/.env
        - docker compose pull
        - docker compose up -d
        - docker compose exec backend php artisan migrate --force