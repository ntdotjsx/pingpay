version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: pingpay-db
    environment:
      POSTGRES_USER: pingpay_user
      POSTGRES_PASSWORD: pingpay_password
      POSTGRES_DB: pingpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # 2. Laravel Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pingpay-server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/var/www/html
      - /var/www/html/vendor
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=pingpay
      - DB_USERNAME=pingpay_user
      - DB_PASSWORD=pingpay_password
      - APP_KEY=base64:IofuLHWReRrbIgHnkCIu/+EHAFFAB78di69RSqRsx7E=
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
    depends_on:
      - db
    restart: always

  # 3. Astro Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pingpay-client
    ports:
      - "4321:4321"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - FRONTEND_URL=http://localhost:4321
      - PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - server
    restart: always

volumes:
  pgdata:
